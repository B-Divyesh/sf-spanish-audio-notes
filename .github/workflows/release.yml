name: Release desktop app
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux system packages
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libasound2-dev libclang-dev cmake
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm test
      - run: npm run test:e2e
      - run: npm run test:installers
      - run: npm run test:native-integrity
      - run: npm run test:native-transcription
      - run: npm run check
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run build
  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macos-x64
          - platform: windows-latest
            target: ""
            label: windows-x64
          - platform: ubuntu-22.04
            target: ""
            label: linux-x64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Require the filesystem-capable macOS baseline
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        run: echo "MACOSX_DEPLOYMENT_TARGET=10.15" >> "$GITHUB_ENV"
      - name: Install Linux system packages
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libclang-dev cmake file gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-alsa pulseaudio xdotool xvfb dbus-x11
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
      - name: Exercise bundled AppImage audio
        if: matrix.platform == 'ubuntu-22.04'
        run: npm run test:appimage
      - uses: actions/upload-artifact@v4
        with:
          name: audio-margin-${{ matrix.label }}
          path: |
            src-tauri/target/**/bundle/**/*.dmg
            src-tauri/target/**/bundle/**/*.msi
            src-tauri/target/**/bundle/**/*.exe
            src-tauri/target/**/bundle/**/*.AppImage
            src-tauri/target/**/bundle/**/*.deb
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: release-assets, merge-multiple: true }
      - name: Determine release tag
        shell: bash
        run: echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
      - name: Use package version for manual releases
        if: github.ref_type != 'tag'
        shell: bash
        run: node -p '"RELEASE_TAG=v" + require("./package.json").version' >> "$GITHUB_ENV"
      - run: node scripts/generate-release-manifest.mjs release-assets
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Audio Margin ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            release-assets/**/*
